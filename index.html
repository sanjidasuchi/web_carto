<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>cat</title>

    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/128/9513/9513911.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" ></script>
    <style>
    #map{
        height: 100vh;
        width: 100vw;
    }
    </style>
</head>
<body>
    <div id="map"></div>
    
<script>
// Define a basemap
const OpenStreetMap_Mapnik = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
	maxZoom: 19,
	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
});

const map = L.map('map',{
    layers: OpenStreetMap_Mapnik,
    center: [ 49, 17 ],
    zoom: 6,
});

let trees;
let appsscriptUrl = "https://script.google.com/macros/s/AKfycbxVpWt82-oN19G09zBDPMc7_8WnMuJJ0fVt4SU9NKGkLe9avwrTbweC6w-9VBrQ9R53/exec"

// --- CHANGE ICON SETTINGS HERE ---
const myCustomIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/128/9513/9513911.png', // <--- PASTE YOUR IMAGE URL HERE
    iconSize: [40, 40], // Size of the icon [width, height]
    iconAnchor: [20, 40], // Point of the icon which will correspond to marker's location (usually middle-bottom)
    popupAnchor: [0, -40] // Point from which the popup should open relative to the iconAnchor
});
// --------------------------------

function reloadLayer(){
    fetch(appsscriptUrl)
    .then(response => response.json())
    .then(data => {
        if(map.hasLayer(trees)){
            map.removeLayer(trees)
        }
        
        trees = L.geoJson(data,{
            // THIS SECTION BELOW TELLS LEAFLET TO USE YOUR IMAGE
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {icon: myCustomIcon});
            },
            onEachFeature: function(feature, layer){
                if (feature.properties && feature.properties.type) {
                    layer.bindPopup("Tree Type: " + feature.properties.type);
                }
            }
        })
        map.addLayer(trees)
    }) 
}

reloadLayer()
</script>
</body>
</html>
